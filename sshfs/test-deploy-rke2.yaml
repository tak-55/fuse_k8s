# =============================================================================
# fd-passing アーキテクチャ用テスト Pod（RKE2 本番環境）
# default namespace の ssh-server Service に接続して動作確認する
#
# 前提:
#   - csi/test-ssh-server.yaml がデプロイ済み
#   - ssh-key Secret が fuse-test-ns に存在すること
#   - ghcr-secret が fuse-test-ns に存在すること
#
# デプロイ:
#   kubectl apply -f sshfs/test-deploy-rke2.yaml -n fuse-test-ns
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: sshfs-fdpass-test
  namespace: fuse-test-ns
spec:
  imagePullSecrets:
    - name: ghcr-secret
  initContainers:
    - name: create-fuse-device
      image: busybox:stable
      command: ["touch", "/fuse-dev/fuse"]
      volumeMounts:
        - name: fuse-device
          mountPath: /fuse-dev

    - name: sshfs-sidecar
      image: ghcr.io/tak-labo/fuse_k8s-sshfs-sidecar:latest
      imagePullPolicy: Always
      restartPolicy: Always
      readinessProbe:
        exec:
          command: ["test", "-f", "/fuse-fd/ready"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30
      volumeMounts:
        - name: fuse-fd
          mountPath: /fuse-fd
        - name: fuse-device
          mountPath: /dev/fuse
          subPath: fuse

  containers:
    - name: app
      image: busybox:stable
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== マウント確認 ==="
          mount | grep fuse || echo "(fuse マウントなし)"
          echo "=== /data の内容 ==="
          ls -la /data
          echo "=== 書き込みテスト (UID=$(id -u)) ==="
          echo "hello rke2 sshfs from uid=$(id -u)" > /data/test.txt && cat /data/test.txt && echo "書き込み成功！"
          sleep infinity
      volumeMounts:
        - name: sshfs-vol
          mountPath: /data

  volumes:
    - name: sshfs-vol
      csi:
        driver: fuse.csi.fuse-k8s.io
        volumeAttributes:
          type: sshfs
          host: "ssh-server.default.svc.cluster.local"
          user: "testuser"
          remotePath: "/data"
          port: "22"
          strictHostKeyCheck: "false"
        nodePublishSecretRef:
          name: ssh-key
    - name: fuse-fd
      emptyDir: {}
    - name: fuse-device
      emptyDir: {}

  terminationGracePeriodSeconds: 30
