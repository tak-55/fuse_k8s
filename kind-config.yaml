kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fuse-dev
nodes:
  - role: control-plane
    extraMounts:
      # FUSE デバイスをマウント（kind コンテナ内で FUSE を利用可能にする）
      - hostPath: /dev/fuse
        containerPath: /dev/fuse
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        featureGates:
          UserNamespacesSupport: true
# containerd の設定:
# - fuse-overlayfs snapshotter: hostUsers: false の Pod に必要
#   （overlay userns /proc/sys/module/overlay/parameters/permit_mounts_in_userns が
#    このカーネルで利用できないため）
# - containerd 再起動後に fuse-overlayfs デーモンの起動が必要:
#   docker exec fuse-dev-control-plane systemctl start containerd-fuse-overlayfs
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".containerd]
      snapshotter = "fuse-overlayfs"
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
      runtime_type = "io.containerd.runc.v2"
      snapshotter = "fuse-overlayfs"
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
        SystemdCgroup = true
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.test-handler]
      runtime_type = "io.containerd.runc.v2"
      snapshotter = "fuse-overlayfs"
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.test-handler.options]
        SystemdCgroup = true

  - |-
    [proxy_plugins]
      [proxy_plugins.fuse-overlayfs]
        address = "/run/containerd-fuse-overlayfs.sock"
        type = "snapshot"
# PSS Restricted は cluster 作成後に namespace ラベルで適用
