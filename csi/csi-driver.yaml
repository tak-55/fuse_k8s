# meta-fuse-csi-plugin: CSI Driver定義
# このリソースはClusterスコープで1回だけデプロイする
apiVersion: v1
kind: Namespace
metadata:
  name: mfcp-system
  labels:
    app.kubernetes.io/name: meta-fuse-csi-plugin
    app.kubernetes.io/component: driver
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: meta-fuse-csi-plugin.csi.storage.pfn.io
  labels:
    app.kubernetes.io/name: meta-fuse-csi-plugin
spec:
  # Podが直接CSIドライバにアタッチ; PVは不要
  attachRequired: false
  # Pod情報をCSIドライバに渡す（NamespaceやUID等）
  podInfoOnMount: true
  # エフェメラルボリューム（Pod内インライン）のみをサポート
  volumeLifecycleModes:
    - Ephemeral
