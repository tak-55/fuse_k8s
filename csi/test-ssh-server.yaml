# =============================================================================
# テスト用 SSH サーバー（SFTP + ChrootDirectory）
#
# 目的:
#   fuse-csi-driver の sshfs 機能をクラスター内でテストするための
#   SFTP 専用 SSH サーバー。シェルアクセスなし・chroot 隔離。
#
# 前提:
#   以下の ConfigMap が作成済みであること:
#   kubectl create configmap sshd-authorized-keys \
#     --from-file=authorized_keys=/tmp/test-sshkey.pub \
#     -n default
#
# chroot 構造:
#   /chroot/testuser/           root:root  755  ← ChrootDirectory
#   /chroot/testuser/.ssh/      root:root  700
#   /chroot/testuser/.ssh/authorized_keys  root:root 644
#   /chroot/testuser/data/      1000:1000  755  ← sshfs remotePath=/data
#
# 接続情報:
#   host: ssh-server.default.svc.cluster.local
#   port: 2222
#   user: testuser
#   remotePath: /data
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: ssh-server
  namespace: default
  labels:
    app: ssh-server
spec:
  initContainers:
    - name: setup-chroot
      image: ubuntu:22.04
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -eux
          apt-get update -qq && apt-get install -y -qq openssh-client 2>/dev/null

          # SSH ホスト鍵を生成
          mkdir -p /etc/ssh/host_keys
          if [ ! -f /etc/ssh/host_keys/ssh_host_ed25519_key ]; then
            ssh-keygen -t ed25519 -f /etc/ssh/host_keys/ssh_host_ed25519_key -N ""
          fi

          # chroot root ディレクトリ: root 所有・755 (OpenSSH の必須要件)
          # /chroot/ 自体も root:root 755 でなければならない（パス全体をチェックされる）
          chown root:root /chroot
          chmod 755 /chroot
          mkdir -p /chroot/testuser
          chown root:root /chroot/testuser
          chmod 755 /chroot/testuser

          # authorized_keys を chroot 内に配置
          # sshd は temporarily_use_uid(1000) で authorized_keys を読む
          # → .ssh/ と authorized_keys は testuser (1000) 所有にする必要がある
          mkdir -p /chroot/testuser/.ssh
          chmod 700 /chroot/testuser/.ssh
          cp /authorized-keys/authorized_keys /chroot/testuser/.ssh/authorized_keys
          chown -R 1000:1000 /chroot/testuser/.ssh
          chmod 644 /chroot/testuser/.ssh/authorized_keys

          # data ディレクトリ: testuser (UID 1000) が読み書き可能
          mkdir -p /chroot/testuser/data
          chown 1000:1000 /chroot/testuser/data
          chmod 755 /chroot/testuser/data

          echo "chroot セットアップ完了"
          ls -la /chroot/testuser/
      volumeMounts:
        - name: chroot-data
          mountPath: /chroot
        - name: host-keys
          mountPath: /etc/ssh/host_keys
        - name: authorized-keys
          mountPath: /authorized-keys
          readOnly: true

  containers:
    - name: sshd
      image: ubuntu:22.04
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -eux
          apt-get update -qq && apt-get install -y -qq openssh-server 2>/dev/null
          # testuser を作成（シェルなし: /sbin/nologin）
          # -p '*': パスワードを無効化しつつアカウントをロックしない（SSH 公開鍵認証に必要）
          id testuser 2>/dev/null || useradd -u 1000 -s /sbin/nologin -d /chroot/testuser -M -p '*' testuser

          # sshd_config を書き出す
          cat > /etc/ssh/sshd_config << 'SSHD_CONFIG'
          Port 2222
          HostKey /etc/ssh/host_keys/ssh_host_ed25519_key
          PubkeyAuthentication yes
          AuthorizedKeysFile /chroot/%u/.ssh/authorized_keys
          PasswordAuthentication no
          PermitRootLogin no
          UsePAM no
          PrintMotd no
          Subsystem sftp internal-sftp
          Match User testuser
              ChrootDirectory /chroot/%u
              ForceCommand internal-sftp
              AllowTcpForwarding no
              X11Forwarding no
              PermitTTY no
          SSHD_CONFIG

          # /run/sshd ディレクトリが必要
          mkdir -p /run/sshd

          echo "=== sshd 起動 (port 2222) ==="
          exec /usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
      ports:
        - containerPort: 2222
          name: ssh
      volumeMounts:
        - name: chroot-data
          mountPath: /chroot
        - name: host-keys
          mountPath: /etc/ssh/host_keys

  volumes:
    - name: chroot-data
      emptyDir: {}
    - name: host-keys
      emptyDir: {}
    - name: authorized-keys
      configMap:
        name: sshd-authorized-keys

---
apiVersion: v1
kind: Service
metadata:
  name: ssh-server
  namespace: default
spec:
  selector:
    app: ssh-server
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
