# =============================================================================
# fuse-csi-driver: ServiceAccount + DaemonSet（k3s 環境版）
#
# k3s の kubelet パスは /var/lib/rancher/k3s/agent/kubelet
# （標準 kubelet の /var/lib/kubelet とは異なる）
#
# 使い方:
#   kubectl apply -f csi/fuse-csi-driver.yaml
#   kubectl apply -f csi/fuse-csi-driver-daemonset-k3s.yaml
#   kubectl get pods -n fuse-csi-system
#
# プライベートリポジトリの場合は imagePullSecrets を設定:
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<GITHUB_USERNAME> \
#     --docker-password=<PAT> \
#     -n fuse-csi-system
#
# resource limits の根拠（50ユーザー並列対応）:
#   ベース driver プロセス: ~100m CPU / 128Mi
#   sshfs/s3fs 1プロセス: ~50m CPU / 64Mi 想定
#   50並列: 50 × 50m = 2500m → limits を 4 CPU
#   50並列: 50 × 64Mi = 3200Mi → limits を 4Gi（余裕を持って）
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: fuse-csi-driver
  namespace: fuse-csi-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuse-csi-driver
  namespace: fuse-csi-system
  labels:
    app.kubernetes.io/name: fuse-csi-driver
    app.kubernetes.io/component: csi-driver
spec:
  selector:
    matchLabels:
      app: fuse-csi-driver
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fuse-csi-driver
    spec:
      serviceAccountName: fuse-csi-driver
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # プライベートリポジトリを使用する場合はコメントを外す
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        # -----------------------------------------------------------------------
        # fuse-csi-driver: sshfs/s3fs を起動し NodePublishVolume を処理する
        # privileged: true は管理者管理の fuse-csi-system namespace でのみ使用
        # ユーザー namespace には一切 privileged が不要になる
        # -----------------------------------------------------------------------
        - name: fuse-csi-driver
          image: ghcr.io/scaleworx-inc/fuse_k8s-fuse-csi-driver:latest
          imagePullPolicy: Always
          args:
            - --endpoint=unix:/csi/csi.sock
            - --nodeid=$(NODE_ID)
            - --v=2
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true         # CSI DaemonSet は管理者管理のため許可
            runAsNonRoot: false
          # マルチユーザー対応: 50ユーザー × sshfs/s3fs を想定したリソース設定
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            # CSI gRPC ソケット
            - name: socket-dir
              mountPath: /csi
            # kubelet ディレクトリ（Bidirectional: マウントをホストに伝播するために必須）
            - name: kubelet-dir
              mountPath: /var/lib/rancher/k3s/agent/kubelet
              mountPropagation: Bidirectional
            # /dev/fuse へのアクセス（sshfs/s3fs が必要）
            - name: dev-fuse
              mountPath: /dev/fuse

        # -----------------------------------------------------------------------
        # node-driver-registrar: CSI ソケットを kubelet に登録する
        # csi-node-driver-registrar v2.10.0 は CSI spec v1.9.0 と互換
        # -----------------------------------------------------------------------
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/rancher/k3s/agent/kubelet/plugins/fuse.csi.fuse-k8s.io/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration

      volumes:
        # CSI gRPC ソケット用ディレクトリ（ホストパス）
        - name: socket-dir
          hostPath:
            path: /var/lib/rancher/k3s/agent/kubelet/plugins/fuse.csi.fuse-k8s.io
            type: DirectoryOrCreate
        # kubelet プラグイン登録用ディレクトリ
        - name: registration-dir
          hostPath:
            path: /var/lib/rancher/k3s/agent/kubelet/plugins_registry
            type: Directory
        # kubelet ディレクトリ（NodePublishVolume の targetPath を含む）
        - name: kubelet-dir
          hostPath:
            path: /var/lib/rancher/k3s/agent/kubelet
            type: Directory
        # FUSE デバイス
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
