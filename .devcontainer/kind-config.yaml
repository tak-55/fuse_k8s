kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fuse-dev
nodes:
  - role: control-plane
    # FUSE に必要な /dev/fuse と mount namespace の設定
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraMounts:
      # /dev/fuse をノードコンテナに共有（macOS の Docker Desktop では自動露出されないため必要）
      - hostPath: /dev/fuse
        containerPath: /dev/fuse
