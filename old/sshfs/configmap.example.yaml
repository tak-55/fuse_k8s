# =============================================================================
# sshfs ConfigMap テンプレート
#
# 使い方:
#   1. このファイルをコピーして環境別の ConfigMap を作成
#      cp configmap.example.yaml configmap.yaml
#   2. 環境に合わせて値を編集
#   3. kubectl apply -f configmap.yaml
#
# 注意: configmap.example.yaml 以外の configmap*.yaml は .gitignore で除外されます
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: sshfs-config
data:
  # SSH 接続先ホスト
  SSHFS_HOST: "your-ssh-host"
  # SSH ユーザー名
  SSHFS_USER: "your-ssh-user"
  # リモートマウントパス
  SSHFS_REMOTE_PATH: "/path/to/remote"
  # SSH ポート番号
  SSHFS_PORT: "22"
  # true にするとコンテナ内 sshd を起動（テスト用）
  USE_LOCAL_SSHD: "false"
  # ホスト鍵の検証 (true | false)
  # デフォルト: true (accept-new: 初回のみ自動受け入れ、以降は検証)
  # テスト・開発環境で完全に無効化したい場合は "false" に設定する
  SSHFS_STRICT_HOST_KEY_CHECK: "true"
