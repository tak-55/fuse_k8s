# =============================================================================
# テスト用 MinIO（S3互換ストレージ）
#
# s3fs の動作確認用。本番環境では使用しないこと。
#
# 接続情報:
#   endpoint: http://minio.default.svc.cluster.local:9000
#   access_key: minioadmin
#   secret_key: minioadmin
#   bucket: test-bucket
#
# セットアップ:
#   kubectl apply -f tests/test-minio.yaml
#   # バケット作成（MinIO Pod起動後）
#   kubectl exec -n default minio -- mc alias set local http://localhost:9000 minioadmin minioadmin
#   kubectl exec -n default minio -- mc mb local/test-bucket
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: minio
  namespace: default
  labels:
    app: minio
spec:
  containers:
    - name: minio
      image: minio/minio:latest
      args: ["server", "/data", "--console-address", ":9001"]
      env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
      ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
      readinessProbe:
        httpGet:
          path: /minio/health/ready
          port: 9000
        initialDelaySeconds: 5
        periodSeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
