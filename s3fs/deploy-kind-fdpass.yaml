# fd-passing アーキテクチャ用 Pod サンプル
# s3fs-sidecar が FUSE データプレーンを担当する
# securityContext / hostUsers は Kyverno が自動注入
apiVersion: v1
kind: Pod
metadata:
  name: s3fs-fdpass-example
  # namespace は Capsule テナント namespace に変更
spec:
  containers:
    - name: app
      image: busybox:stable
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== マウント確認 ==="
          ls -la /data
          echo "=== 書き込みテスト ==="
          echo "hello s3 fd-pass $(date)" > /data/test.txt && cat /data/test.txt
          sleep infinity
      volumeMounts:
        - name: s3fs-vol
          mountPath: /data

    - name: s3fs-sidecar
      # kind 環境: imagePullPolicy: Never を使用
      image: s3fs-sidecar:latest
      imagePullPolicy: Never
      # securityContext は Kyverno が自動注入（非特権）
      volumeMounts:
        - name: fuse-fd
          mountPath: /fuse-fd

  volumes:
    - name: s3fs-vol
      csi:
        driver: fuse.csi.fuse-k8s.io
        volumeAttributes:
          type: s3fs
          bucket: "your-bucket"
          endpoint: "http://your-s3-endpoint:9000"
          region: "us-east-1"
          noCheckCert: "false"
        nodePublishSecretRef:
          name: s3-credentials         # kubectl create secret generic s3-credentials \
                                        #   --from-literal=access_key=KEY \
                                        #   --from-literal=secret_key=SECRET

    - name: fuse-fd
      emptyDir: {}
      # CSI DaemonSet が params.json + csi.sock をここに書く
      # sidecar は /fuse-fd/csi.sock に接続して fd を受け取る

  terminationGracePeriodSeconds: 30
