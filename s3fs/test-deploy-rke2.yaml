# =============================================================================
# fd-passing アーキテクチャ用テスト Pod（RKE2 本番環境）
# default namespace の MinIO Service に接続して動作確認する
#
# 前提:
#   - csi/test-minio.yaml がデプロイ済み（test-bucket 作成済み）
#   - s3-credentials Secret が fuse-test-ns に存在すること
#   - ghcr-secret が fuse-test-ns に存在すること
#
# デプロイ:
#   kubectl apply -f s3fs/test-deploy-rke2.yaml -n fuse-test-ns
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: s3fs-fdpass-test
  namespace: fuse-test-ns
spec:
  imagePullSecrets:
    - name: ghcr-secret
  initContainers:
    - name: create-fuse-device
      image: busybox:stable
      command: ["touch", "/fuse-dev/fuse"]
      volumeMounts:
        - name: fuse-device
          mountPath: /fuse-dev

    - name: s3fs-sidecar
      image: ghcr.io/tak-labo/fuse_k8s-s3fs-sidecar:latest
      imagePullPolicy: Always
      restartPolicy: Always
      readinessProbe:
        exec:
          command: ["test", "-f", "/fuse-fd/ready"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30
      volumeMounts:
        - name: fuse-fd
          mountPath: /fuse-fd
        - name: fuse-device
          mountPath: /dev/fuse
          subPath: fuse

  containers:
    - name: app
      image: busybox:stable
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== マウント確認 ==="
          mount | grep fuse || echo "(fuse マウントなし)"
          echo "=== /data の内容 ==="
          ls -la /data
          echo "=== 書き込みテスト (UID=$(id -u)) ==="
          echo "hello rke2 s3fs from uid=$(id -u)" > /data/test.txt && cat /data/test.txt && echo "書き込み成功！"
          sleep infinity
      volumeMounts:
        - name: s3fs-vol
          mountPath: /data

  volumes:
    - name: s3fs-vol
      csi:
        driver: fuse.csi.fuse-k8s.io
        volumeAttributes:
          type: s3fs
          bucket: "test-bucket"
          endpoint: "http://minio.default.svc.cluster.local:9000"
          region: "us-east-1"
          noCheckCert: "false"
        nodePublishSecretRef:
          name: s3-credentials
    - name: fuse-fd
      emptyDir: {}
    - name: fuse-device
      emptyDir: {}

  terminationGracePeriodSeconds: 30
