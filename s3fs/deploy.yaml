# =============================================================================
# fd-passing アーキテクチャ用 Pod サンプル（本番環境）
# s3fs-sidecar が FUSE データプレーンを担当する
#
# 使い方:
#   1. S3 認証情報 Secret を作成
#      kubectl create secret generic s3-credentials \
#        --from-literal=access_key=YOUR_ACCESS_KEY \
#        --from-literal=secret_key=YOUR_SECRET_KEY \
#        -n <tenant-namespace>
#
#   2. volumeAttributes の bucket / endpoint を実環境に合わせて変更
#
#   3. Pod をデプロイ
#      kubectl apply -f s3fs/deploy.yaml -n <tenant-namespace>
#
# 注意:
#   - FUSE CSI ボリュームを持つ Pod は hostUsers: false が Kyverno から自動除外される
#     （/dev/fuse FUSE は MOUNT_ATTR_IDMAP 非対応のため）
#   - securityContext（PSS restricted）は Kyverno が自動注入
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: s3fs-example
  # namespace は Capsule テナント namespace に変更すること
spec:
  # s3fs-sidecar を sidecar initContainer として定義する。
  # FUSE デーモン（s3fs）が起動し /fuse-fd/ready を書いた後に app コンテナが起動する。
  # これにより FUSE bind mount が s3fs 起動前に runc でタイムアウトする問題を回避する。
  # （Kubernetes 1.29+ の sidecar initContainer 機能を使用）
  initContainers:
    # /dev/fuse 用の空ファイルを作成（libfuse が stat("/dev/fuse") を要求するため）
    # コンテナ runtime は /dev を fresh tmpfs に差し替えるため、
    # emptyDir subPath で /dev/fuse を上書きする必要がある。
    - name: create-fuse-device
      image: busybox:stable
      command: ["touch", "/fuse-dev/fuse"]
      volumeMounts:
        - name: fuse-device
          mountPath: /fuse-dev

    # s3fs-sidecar: FUSE fd を受け取り s3fs を起動するサイドカー
    # restartPolicy: Always → sidecar initContainer（app より先に起動、app と並行して稼働）
    - name: s3fs-sidecar
      image: ghcr.io/scaleworx-inc/fuse_k8s-s3fs-sidecar:latest
      imagePullPolicy: Always
      restartPolicy: Always
      # readinessProbe が通過するまで app コンテナの起動を待機する
      readinessProbe:
        exec:
          command: ["test", "-f", "/fuse-fd/ready"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        - name: fuse-fd
          mountPath: /fuse-fd
        # /dev/fuse を空ファイルで上書き（libfuse の stat チェックを通過させる）
        - name: fuse-device
          mountPath: /dev/fuse
          subPath: fuse

  containers:
    - name: app
      image: your-app-image:latest  # 実際のアプリイメージに変更すること
      # securityContext（PSS restricted）は Kyverno が自動注入:
      #   runAsNonRoot: true, runAsUser: 1000
      #   allowPrivilegeEscalation: false, capabilities.drop: [ALL]
      #   seccompProfile: RuntimeDefault
      # FUSE CSI ボリュームがあるため hostUsers は注入されない（MOUNT_ATTR_IDMAP 非対応）
      volumeMounts:
        - name: s3fs-vol
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

  volumes:
    - name: s3fs-vol
      csi:
        driver: fuse.csi.fuse-k8s.io
        volumeAttributes:
          type: s3fs
          bucket: "your-bucket"
          endpoint: "https://your-s3-endpoint"   # MinIO: http://minio.svc:9000 / AWS: https://s3.amazonaws.com
          region: "us-east-1"
          noCheckCert: "false"                    # 自己署名証明書の場合は "true"
        nodePublishSecretRef:
          name: s3-credentials          # kubectl create secret generic s3-credentials \
                                        #   --from-literal=access_key=KEY \
                                        #   --from-literal=secret_key=SECRET \
                                        #   -n <namespace>
    - name: fuse-fd
      emptyDir: {}
    - name: fuse-device
      emptyDir: {}

  terminationGracePeriodSeconds: 30
