# =============================================================================
# meta-fuse-csi-plugin + s3fs: デプロイマニフェスト（レジストリイメージ版）
#
# 使い方:
#   1. configmap.example.yaml をコピーして環境別 ConfigMap を作成・適用
#   2. S3認証情報Secretを作成:
#      kubectl create secret generic s3-credentials \
#        --from-literal=access_key=YOUR_ACCESS_KEY \
#        --from-literal=secret_key=YOUR_SECRET_KEY
#   3. kubectl apply -f deploy.yaml
#
# アーキテクチャ:
#   [s3fs sidecar]
#     └─ touch /dev/fuse            (libfuse に fusermount3 経由を強制)
#     └─ s3fs ... -f                (フォアグラウンド起動)
#     └─ fusermount3-proxy          (fusermount3 として差し替え済み)
#          └─ UDS ─────────────────> [CSI DaemonSet (CAP_SYS_ADMIN)]
#                                        └─ open("/dev/fuse") + mount()
#   [app container]
#     └─ /data (HostToContainer 伝播)
# =============================================================================

# -----------------------------------------------------------------------
# Pod: s3fs マウント + アプリケーション (Kubernetes v1.29+ サイドカー対応)
# -----------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: s3fs-example
  labels:
    app.kubernetes.io/name: s3fs-proxy
    app.kubernetes.io/component: example
spec:
  # -----------------------------------------------------------------------
  # s3fs コンテナを restartable init container (sidecar) として定義。
  # startupProbe が成功するまでアプリコンテナは起動しない。
  # (Kubernetes v1.29+ の SidecarContainers 機能を使用)
  # -----------------------------------------------------------------------
  initContainers:
    - name: s3fs-proxy
      image: ghcr.io/tak-lab55/fuse_k8s-s3fs:latest
      imagePullPolicy: Always
      securityContext:
        privileged: true
        runAsNonRoot: false
      restartPolicy: Always   # サイドカーとして動作 (v1.29+)
      env:
        # S3 接続情報 (ConfigMap から注入)
        - name: S3FS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: s3fs-config
              key: S3FS_BUCKET
        - name: S3FS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: s3fs-config
              key: S3FS_ENDPOINT
        - name: S3FS_REGION
          valueFrom:
            configMapKeyRef:
              name: s3fs-config
              key: S3FS_REGION
        # S3認証情報 (Secretから注入)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: access_key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: secret_key
        # s3fs マウントポイント = CSIボリュームのコンテナ内マウントパスと一致させること
        - name: S3FS_MOUNT_POINT
          value: /mnt/s3fs
        # 追加のs3fsオプション (オプショナル)
        - name: S3FS_OPTS
          value: ""
        # -----------------------------------------------------------------------
        # FUSERMOUNT3PROXY_FDPASSING_SOCKPATH:
        #   fusermount3-proxy が CSI DaemonSet と通信する UDS ソケットのフルパス。
        #   volumes[].csi.volumeAttributes.socketDir + "/" + socketName と一致させる。
        # -----------------------------------------------------------------------
        - name: FUSERMOUNT3PROXY_FDPASSING_SOCKPATH
          value: /var/lib/mfcp/uds/mfcp.sock
      volumeMounts:
        # CSI DaemonSet との UDS 通信用ソケットディレクトリ (emptyDir)
        - name: fuse-socket-dir
          mountPath: /var/lib/mfcp/uds
        # s3fs マウントポイント
        # Bidirectional: ホスト側にマウントを伝播させるために必須
        - name: s3fs-volume
          mountPath: /mnt/s3fs
          mountPropagation: Bidirectional
      # マウント完了プローブ: アプリコンテナはこれが成功するまで起動しない
      startupProbe:
        exec:
          command:
            - sh
            - -c
            - "mount | grep fuse.s3fs"
        initialDelaySeconds: 5
        periodSeconds: 3
        failureThreshold: 30
        successThreshold: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

  containers:
    # -----------------------------------------------------------------------
    # アプリケーションコンテナ
    # s3fs-proxy の startupProbe が成功してから起動するため、
    # /data には確実に s3fs がマウントされている。
    # -----------------------------------------------------------------------
    - name: app
      image: busybox:stable
      securityContext:
        runAsNonRoot: false
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== s3fs マウント確認 ==="
          mount | grep fuse
          echo "=== /data の内容 ==="
          ls -la /data
          sleep infinity
      volumeMounts:
        # s3fs でマウントされたディレクトリを /data として利用
        # HostToContainer: ホスト側のマウントをコンテナに伝播
        - name: s3fs-volume
          mountPath: /data
          mountPropagation: HostToContainer
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

  volumes:
    # CSI DaemonSet との UDS 通信用 emptyDir
    - name: fuse-socket-dir
      emptyDir: {}

    # meta-fuse-csi-plugin が管理する CSI エフェメラルボリューム
    - name: s3fs-volume
      csi:
        driver: meta-fuse-csi-plugin.csi.storage.pfn.io
        volumeAttributes:
          # UDS ソケットのディレクトリパス (fuse-socket-dir マウントポイントと一致)
          socketDir: /var/lib/mfcp/uds
          # UDS ソケットファイル名
          socketName: mfcp.sock
          fdPassingEmptyDirName: fuse-socket-dir
          fdPassingSocketName: mfcp.sock

  # プライベートリポジトリの場合は以下のコメントを外してください
  # imagePullSecrets:
  #   - name: ghcr-secret

  # s3fs コンテナが正常にアンマウントするための猶予時間
  terminationGracePeriodSeconds: 30
