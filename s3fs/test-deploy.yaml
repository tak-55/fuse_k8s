# =============================================================================
# fd-passing アーキテクチャ用テスト Pod（kind 開発環境）
# default namespace の MinIO に接続して動作確認する
#
# 前提:
#   - minio Pod + Service が default namespace にデプロイ済み
#   - s3-credentials Secret が test-tenant-ns に存在すること
#     kubectl create secret generic s3-credentials \
#       --from-literal=access_key=minioadmin \
#       --from-literal=secret_key=minioadmin \
#       -n test-tenant-ns
#   - MinIO に test-bucket が作成済みであること
#
# デプロイ:
#   kubectl apply -f s3fs/test-deploy.yaml -n test-tenant-ns
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: s3fs-fdpass-test
  namespace: test-tenant-ns
spec:
  initContainers:
    # /dev/fuse 用の空ファイルを作成（libfuse が stat("/dev/fuse") を要求するため）
    - name: create-fuse-device
      image: busybox:stable
      command: ["touch", "/fuse-dev/fuse"]
      volumeMounts:
        - name: fuse-device
          mountPath: /fuse-dev

    # s3fs-sidecar: FUSE fd を受け取り s3fs を起動するサイドカー
    - name: s3fs-sidecar
      image: s3fs-sidecar:latest
      imagePullPolicy: Never
      restartPolicy: Always
      readinessProbe:
        exec:
          command: ["test", "-f", "/fuse-fd/ready"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 30
      volumeMounts:
        - name: fuse-fd
          mountPath: /fuse-fd
        - name: fuse-device
          mountPath: /dev/fuse
          subPath: fuse

  containers:
    - name: app
      image: busybox:stable
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== マウント確認 ==="
          mount | grep fuse || echo "(fuse マウントなし)"
          echo "=== /data の内容 ==="
          ls -la /data
          echo "=== 書き込みテスト (UID=$(id -u)) ==="
          echo "hello s3 from uid=$(id -u)" > /data/test.txt && cat /data/test.txt && echo "書き込み成功！"
          sleep infinity
      volumeMounts:
        - name: s3fs-vol
          mountPath: /data

  volumes:
    - name: s3fs-vol
      csi:
        driver: fuse.csi.fuse-k8s.io
        volumeAttributes:
          type: s3fs
          bucket: "test-bucket"
          endpoint: "http://minio.default.svc.cluster.local:9000"
          region: "us-east-1"
          noCheckCert: "false"
        nodePublishSecretRef:
          name: s3-credentials
    - name: fuse-fd
      emptyDir: {}
    - name: fuse-device
      emptyDir: {}

  terminationGracePeriodSeconds: 30
