# =============================================================================
# s3fs ConfigMap テンプレート（環境固有値は別ファイルで管理）
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3fs-config
data:
  S3FS_BUCKET: "your-bucket"
  S3FS_ENDPOINT: "https://your-s3-endpoint"
  S3FS_REGION: "us-east-1"
  S3FS_NO_CHECK_CERT: "false"
