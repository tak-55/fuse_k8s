# =============================================================================
# s3fs ConfigMap テンプレート
#
# 使い方:
#   1. このファイルをコピーして環境別の ConfigMap を作成
#      cp configmap.example.yaml configmap-kind.yaml
#   2. 環境に合わせて値を編集
#   3. kubectl apply -f configmap-kind.yaml
#
# 注意: configmap.example.yaml 以外の configmap*.yaml は .gitignore で除外されます
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3fs-config
data:
  # S3 バケット名
  S3FS_BUCKET: "your-bucket-name"
  # S3 エンドポイント URL
  S3FS_ENDPOINT: "http://your-s3-endpoint:9000"
  # S3 リージョン
  S3FS_REGION: "us-east-1"
  # TLS証明書検証の無効化 (true | false)
  # デフォルト: false (検証を有効化)
  # MinIOなど自己署名証明書環境では "true" に設定する
  S3FS_NO_CHECK_CERT: "false"
