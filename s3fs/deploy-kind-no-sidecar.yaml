# =============================================================================
# ユーザー Pod サンプル: s3fs（サイドカーなし版）
#
# 使い方:
#   1. Capsule テナント namespace に Secret を作成
#      kubectl create secret generic s3-credentials \
#        --from-literal=access_key=YOUR_ACCESS_KEY \
#        --from-literal=secret_key=YOUR_SECRET_KEY \
#        -n <tenant-namespace>
#
#   2. volumeAttributes の bucket / endpoint を実環境に合わせて変更
#
#   3. Pod をデプロイ（Kyverno が securityContext と hostUsers: false を自動注入）
#      kubectl apply -f s3fs/deploy-kind-no-sidecar.yaml -n <tenant-namespace>
#
# CSI driver が事前にデプロイ済みであること:
#   kubectl apply -f csi/fuse-csi-driver.yaml
#   kubectl apply -f csi/fuse-csi-driver-daemonset.yaml
#
# 旧アーキテクチャ（deploy-kind.yaml）との違い:
#   - s3fs-proxy サイドカーが不要（CSI driver が代わりに処理）
#   - privileged: true が不要（PSS restricted に準拠）
#   - securityContext は Kyverno が自動注入（ユーザーは書かなくてよい）
#   - hostUsers: false も Kyverno が自動注入
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: s3fs-example
  # namespace は Capsule テナント namespace (例: oil-ns-1) に変更すること
  labels:
    app.kubernetes.io/name: s3fs-example
spec:
  containers:
    - name: app
      image: busybox:stable
      # securityContext は Kyverno が以下を自動注入するため記述不要:
      #   runAsNonRoot: true
      #   runAsUser: 1000
      #   seccompProfile: { type: RuntimeDefault }
      #   allowPrivilegeEscalation: false
      #   capabilities: { drop: [ALL] }
      # spec.hostUsers: false も Kyverno が自動注入
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== s3fs マウント確認 ==="
          mount | grep fuse || echo "(fuse マウントなし)"
          echo "=== /data の内容 ==="
          ls -la /data
          echo "=== 書き込みテスト (UID=$(id -u)) ==="
          echo "hello s3 from uid=$(id -u)" > /data/test.txt && cat /data/test.txt
          sleep infinity
      volumeMounts:
        - name: s3fs-vol
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

  volumes:
    - name: s3fs-vol
      csi:
        driver: fuse.csi.fuse-k8s.io
        volumeAttributes:
          # type: sshfs または s3fs を指定
          type: s3fs
          # S3 接続情報 (環境に合わせて変更)
          bucket: "your-bucket"
          endpoint: "http://your-s3-endpoint:9000"
          region: "us-east-1"
          # TLS 証明書検証: "false"=有効（デフォルト）/ "true"=無効（自己署名証明書環境用）
          noCheckCert: "false"
        nodePublishSecretRef:
          # S3 認証情報を格納する Secret 名
          # kubectl create secret generic s3-credentials \
          #   --from-literal=access_key=KEY --from-literal=secret_key=SECRET \
          #   -n <tenant-namespace>
          name: s3-credentials

  terminationGracePeriodSeconds: 30
