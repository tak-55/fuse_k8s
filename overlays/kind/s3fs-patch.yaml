apiVersion: v1
kind: Pod
metadata:
  name: s3fs-fdpass-example
spec:
  initContainers:
    - name: s3fs-sidecar
      image: s3fs-sidecar:latest
      imagePullPolicy: Never
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
  containers:
    - name: app
      image: busybox:stable
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== マウント確認 ==="
          ls -la /data
          echo "=== 書き込みテスト ==="
          echo "hello s3 fd-pass $(date)" > /data/test.txt && cat /data/test.txt
          sleep infinity
