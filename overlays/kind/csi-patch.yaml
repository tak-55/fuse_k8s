apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuse-csi-driver
  namespace: fuse-csi-system
spec:
  template:
    spec:
      containers:
        - name: fuse-csi-driver
          image: fuse-csi-driver:latest
          imagePullPolicy: Never
        - name: node-driver-registrar
          securityContext:
            runAsNonRoot: false
