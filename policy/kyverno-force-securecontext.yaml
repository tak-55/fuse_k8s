# =============================================================================
# Kyverno ClusterPolicy: PSS Restricted 準拠 securityContext 自動注入
#
# Capsule テナントの namespace に属する Pod に最小権限の securityContext を
# 自動注入する。ユーザーは securityContext を書かなくてよい。
#
# +(key): value は「未設定の場合のみ設定」を意味する Kyverno の構文。
# ユーザーが明示的に書いた値は上書きされない。
#
# 注入される設定:
#   Pod spec:
#     runAsNonRoot: true          → root での実行を禁止
#     runAsUser: 1000             → UID 1000 で実行
#     seccompProfile: RuntimeDefault → seccomp プロファイル適用
#   コンテナごと:
#     allowPrivilegeEscalation: false → 特権昇格を禁止
#     capabilities.drop: ALL          → 全 capability を削除
#
# 前提:
#   helm install kyverno kyverno/kyverno -n kyverno --create-namespace
#
# 動作確認:
#   kubectl get pod <name> -n <tenant-ns> -o yaml | \
#     grep -A10 "runAsNonRoot\|seccompProfile\|allowPrivilegeEscalation"
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: force-secure-context-to-pod
  annotations:
    policies.kyverno.io/title: Force Secure Context for Tenant Pods
    policies.kyverno.io/description: >
      Capsule テナントの namespace に属する Pod に PSS restricted 準拠の
      securityContext を自動注入する。
      ユーザーが securityContext を書かなくても最小権限で動作する。
spec:
  rules:
  - name: mutate-pod-spec
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaceSelector:
            matchExpressions:
            - key: capsule.clastix.io/tenant
              operator: Exists
    mutate:
      patchStrategicMerge:
        spec:
          securityContext:
            # +(key) 構文: 未設定の場合のみ適用（ユーザーの明示設定を尊重）
            +(runAsNonRoot): true
            +(runAsUser): 1000
            +(seccompProfile):
              type: RuntimeDefault
          containers:
          - (name): "*"
            securityContext:
              +(allowPrivilegeEscalation): false
              +(capabilities):
                drop:
                - ALL
          # initContainers にも適用（サイドカーを含む）
          initContainers:
          - (name): "*"
            securityContext:
              +(allowPrivilegeEscalation): false
              +(capabilities):
                drop:
                - ALL
